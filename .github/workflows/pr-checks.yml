name: PR checks

# Project-management checks on every pull request, so each PR is traceable on
# the board: it links the issue it closes, has a type label and the sprint
# milestone, describes what changed and how it was tested, and comes from a
# branch named <type>/<short-description>. Dependabot PRs are exempt.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, milestoned, demilestoned]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  traceability:
    name: PR is linked, labelled and described
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const body = pr.body || ''
            const problems = []

            if (!/\b(close[sd]?|fix(e[sd])?|resolve[sd]?|part of|refs?|related to)\s+#\d+/i.test(body))
              problems.push('The description must link its issue: "Closes #123" (or "Part of #123" when several PRs share one issue).')
            if (pr.labels.length === 0)
              problems.push('Add at least one label (user story, bug, enhancement, ci/cd, documentation, ...).')
            if (!pr.milestone)
              problems.push('Set the sprint milestone (e.g. "Sprint 4").')
            const what = (body.split(/^## How it was tested/m)[0] || '').replace(/<!--[\s\S]*?-->/g, '').replace(/^## What and why/m, '').replace(/Closes #\d+/gi, '').trim()
            if (what.length < 20)
              problems.push('Explain what the PR changes and why (the "What and why" section of the template).')
            if (!/^(feature|fix|enhancement|chore|ci|docs|refactor|test|hotfix)\/[a-z0-9._-]+$/.test(pr.head.ref))
              problems.push(`Branch "${pr.head.ref}" should be named <type>/<short-description>, e.g. feature/ai-job-matching or fix/job-search-escaping.`)

            await core.summary
              .addHeading('PR traceability')
              .addList([
                `Linked issue: ${/#\d+/.test(body) ? 'yes' : 'no'}`,
                `Labels: ${pr.labels.map(l => l.name).join(', ') || 'none'}`,
                `Milestone: ${pr.milestone ? pr.milestone.title : 'none'}`,
                `Branch: ${pr.head.ref}`,
              ])
              .write()

            if (problems.length) core.setFailed(problems.join('\n'))
            else core.info('PR is linked to an issue, labelled, has a milestone and a description.')
