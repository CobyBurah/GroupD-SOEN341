name: Dependency audit

# Vulnerable dependencies: npm audit on every run, plus GitHub's dependency
# review on pull requests (blocks PRs that add high-severity vulnerabilities).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Save audit report
        if: always()
        run: npm audit --omit=dev --json > npm-audit.json || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30
      - name: Fail on high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
